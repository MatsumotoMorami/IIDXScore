; IIDXScore 0.5.3；修改后需下次启动游戏才生效。
[Score]
; 1=启用；0=不挂接。
Enabled=1
; 1=读取个人成绩时补入本地最佳；0=只保存本地记录。
Overlay=1
; 1=用本地最高 EX 对应的真实 ghost 恢复个人最佳分数柱；0=关闭。
; 需要 Overlay=1；服务器已有同分或更高的 ghost 时保留服务器曲线。
; 旧数据库中的完整快照可直接使用；缺失或校验失败时不生成假曲线。
GhostOverlay=1
; SQLite 路径；相对路径以本 DLL 所在目录为基准。
DatabasePath=scores/IIDXScore.sqlite3
; 服务器隔离名称。换服务器请更改，避免相同 DJ ID 混用成绩。
ServerKey=default
; 实际曲库索引文件。取整个文件 SHA256 作为曲库命名空间。
; 默认对应 IIDX 34 原版曲库；IIDX 33 用户需改成实际使用的旧曲库索引。
; 新成绩直接写入当前曲库作用域；旧成绩不会删除。
MusicDatabase=data/info/0/music_data.bin
; 可选：本地 Omni 曲库索引。用于在当前 AC 曲库上补充缺少的歌曲／谱面，
; 构成 AC+Omni 成绩作用域；AC 已存在的谱面优先。空值=只用 AC 曲库。
; 此设置仅影响成绩匹配，不能使游戏加载 Omni 曲包。
; 启用后也会合并当前 Omni 索引对应的旧版独立成绩作用域。
OmniMusicDatabase=
; 可选：填写旧 IIDX 33/34 曲库索引，启动时把同服务器、标题与谱面档位
; 相同的旧成绩合并到当前曲库作用域。歌曲 ID 改号时要求标题在新旧索引均唯一。
; 空值=关闭迁移。请保留旧数据库，并在游戏退出后先备份整个 SQLite 数据库。
; 相对路径以本 DLL 所在目录为基准；如需迁移 Omnimix，指向旧 music_omni.bin。
LegacyMusicDatabase=
